# GitHub Pages (Jekyll) build settings.
# The site is plain static HTML/CSS/JS. Every page and asset is copied through
# unchanged (no file uses front matter). This list only keeps tooling and the
# separate Vercel admin tool from being published on the public domain.
# Note: setting `exclude` replaces Jekyll's default list, so node_modules and
# the Ruby files are listed explicitly.
exclude:
  - api
  - admin
  - scripts
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - vercel.json
  - package.json
  - package-lock.json
  - README.md
  - .vercelignore
  - .gitignore
